name: Doulor Cloud 自动签到

on:
  schedule:
    # UTC 00:10 = 北京时间 08:10(GitHub 定时任务可能延迟几分钟)
    - cron: "10 0 * * *"
  workflow_dispatch: # 支持手动点击运行

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: |
          npm init -y >/dev/null
          npm i playwright
          npx playwright install --with-deps chromium

      - name: 执行签到
        env:
          DOULOR_USER: ${{ secrets.DOULOR_USER }}
          DOULOR_PASS: ${{ secrets.DOULOR_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node scripts/checkin.mjs

      - name: 失败时保存截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
          if-no-files-found: ignore
